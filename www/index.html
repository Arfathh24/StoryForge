<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#171a22"><meta name="description" content="StoryForge offline writing studio for movies, anime, books, scripts and summaries">
<link rel="manifest" href="manifest.webmanifest">
<title>StoryForge — Writing Studio</title>
<style>
:root{--bg:#0f1117;--panel:#171a22;--panel2:#1e222c;--text:#f3f4f7;--muted:#9aa3b2;--accent:#6d8cff;--line:#303746;--paper:#fffdf8;--ink:#20232a;--paperline:#d7dce5}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--text);font-family:Inter,system-ui,-apple-system,Segoe UI,sans-serif;height:100vh;overflow:hidden}.app{display:grid;grid-template-columns:260px 1fr 290px;height:100vh}.sidebar,.right{background:var(--panel);border-color:var(--line)}.sidebar{border-right:1px solid var(--line);padding:18px;overflow:auto}.right{border-left:1px solid var(--line);padding:18px;overflow:auto}.brand{font-weight:800;font-size:20px;margin-bottom:18px}.brand span{color:var(--accent)}button,input,select,textarea{font:inherit}button{border:1px solid var(--line);background:var(--panel2);color:var(--text);border-radius:10px;padding:9px 12px;cursor:pointer}button:hover{filter:brightness(1.12)}.primary{background:var(--accent);border-color:var(--accent);color:#fff}.nav button{width:100%;text-align:left;margin:4px 0}.section-title{font-size:11px;text-transform:uppercase;color:var(--muted);letter-spacing:.12em;margin:22px 4px 8px}.projects{display:grid;gap:6px}.project{padding:9px;border-radius:9px;cursor:pointer;color:#d9dde6}.project.active{background:var(--panel2);outline:1px solid var(--line)}.main{display:flex;flex-direction:column;min-width:0}.top{height:64px;border-bottom:1px solid var(--line);display:flex;align-items:center;gap:10px;padding:10px 16px}.title{font-weight:700;flex:1;min-width:0}.title input{background:transparent;border:0;color:var(--text);font-size:18px;font-weight:700;width:100%;outline:none}.editor-wrap{flex:1;overflow:auto;padding:28px}.paper{max-width:850px;min-height:calc(100vh - 160px);margin:0 auto;background:var(--paper);color:var(--ink);box-shadow:0 10px 40px #0008;padding:70px 72px;position:relative}.paper.ruled{background-image:repeating-linear-gradient(to bottom,transparent 0,transparent 30px,var(--paperline) 31px);background-size:100% 31px}.paper.script{font-family:Courier New,monospace;max-width:900px}.paper.book{font-family:Georgia,serif}.paper h1{margin:0 0 25px;text-align:center;font-size:30px}.paper textarea{width:100%;min-height:650px;border:0;outline:0;resize:none;background:transparent;color:inherit;font:inherit;font-size:17px;line-height:1.8}.script textarea{font-size:15px;line-height:1.55}.bottom{height:40px;border-top:1px solid var(--line);display:flex;align-items:center;gap:18px;padding:0 16px;color:var(--muted);font-size:12px}.toolrow{display:flex;gap:6px;flex-wrap:wrap}.toolrow button{font-size:12px}.card{background:var(--panel2);border:1px solid var(--line);border-radius:12px;padding:13px;margin-bottom:12px}.card h3{font-size:13px;margin:0 0 10px}.stat{display:flex;justify-content:space-between;color:var(--muted);font-size:13px;padding:5px 0}.stat b{color:var(--text)}.suggestion{padding:8px;border-radius:8px;background:#242a36;margin-top:7px;font-size:12px}.modal{position:fixed;inset:0;background:#0009;display:none;align-items:center;justify-content:center;padding:20px;z-index:10}.modal.show{display:flex}.dialog{background:var(--panel);border:1px solid var(--line);border-radius:16px;padding:20px;max-width:520px;width:100%}.dialog input,.dialog select{width:100%;padding:11px;border:1px solid var(--line);border-radius:9px;background:var(--panel2);color:var(--text);margin:7px 0 14px}.dialog-actions{display:flex;justify-content:flex-end;gap:8px}.toast{position:fixed;bottom:55px;left:50%;transform:translateX(-50%);background:#222936;border:1px solid var(--line);padding:10px 14px;border-radius:10px;display:none;z-index:20}.toast.show{display:block}@media(max-width:900px){.app{grid-template-columns:1fr}.sidebar,.right{display:none}.editor-wrap{padding:10px}.paper{padding:45px 25px;min-height:calc(100vh - 115px)}}
</style></head>
<body>
<div class="app">
<aside class="sidebar"><div class="brand">Story<span>Forge</span></div><div class="nav"><button class="primary" id="newBtn">＋ New Project</button><button data-filter="all">🏠 All Projects</button><button data-filter="movie">🎬 Movies</button><button data-filter="anime">📺 Anime</button><button data-filter="book">📚 Books</button><button data-filter="summary">📝 Summaries</button><button data-filter="free">✍️ Free Writing</button></div><div class="section-title">Projects</div><div id="projects" class="projects"></div></aside>
<main class="main"><header class="top"><div class="title"><input id="projectTitle" value="Untitled Project"></div><div class="toolrow"><button id="saveBtn">💾 Save</button><button id="exportTxt">TXT</button><button id="exportPdf">PDF</button><button id="formatBtn">Format</button></div></header><div class="editor-wrap"><section id="paper" class="paper book"><h1 id="pageHeading">Chapter 1</h1><textarea id="editor" spellcheck="true" placeholder="Start writing..."></textarea></section></div><footer class="bottom"><span id="saveStatus">Saved locally</span><span id="words">0 words</span><span id="chars">0 characters</span><span id="readtime">0 min read</span></footer></main>
<aside class="right"><div class="card"><h3>Project</h3><div class="stat"><span>Type</span><b id="typeStat">Book</b></div><div class="stat"><span>Words</span><b id="words2">0</b></div><div class="stat"><span>Characters</span><b id="chars2">0</b></div><div class="stat"><span>Reading time</span><b id="time2">0 min</b></div></div><div class="card"><h3>Writing help</h3><button id="checkBtn" style="width:100%">✓ Check writing</button><div id="suggestions"></div></div><div class="card"><h3>Page style</h3><select id="styleSelect" style="width:100%;padding:9px;background:var(--panel);color:var(--text);border:1px solid var(--line);border-radius:8px"><option value="book">Book</option><option value="ruled">Ruled</option><option value="script">Screenplay</option></select></div><div class="card"><h3>Quick tools</h3><div class="toolrow"><button id="chapterBtn">＋ Chapter</button><button id="sceneBtn">＋ Scene</button><button id="clearBtn">Clear</button></div></div></aside>
</div>
<div class="modal" id="modal"><div class="dialog"><h2>New Project</h2><label>Title</label><input id="newTitle" placeholder="My Story"><label>Type</label><select id="newType"><option value="movie">Movie Script</option><option value="anime">Anime Script</option><option value="book" selected>Book / Novel</option><option value="summary">Summary</option><option value="free">Free Writing</option></select><div class="dialog-actions"><button id="cancel">Cancel</button><button class="primary" id="create">Create</button></div></div></div><div class="toast" id="toast"></div>
<script>
const KEY='storyforge.projects.v1';let projects=JSON.parse(localStorage.getItem(KEY)||'[]');let currentId=null,filter='all';
const $=id=>document.getElementById(id);function uid(){return Date.now().toString(36)+Math.random().toString(36).slice(2)}
function saveAll(){localStorage.setItem(KEY,JSON.stringify(projects))}function current(){return projects.find(p=>p.id===currentId)}
function seed(){if(!projects.length){projects=[{id:uid(),title:'My First Story',type:'book',style:'book',heading:'Chapter 1',text:'Start writing your story here...\n\nStoryForge saves your work locally on this device.' ,updated:Date.now()}];currentId=projects[0].id;saveAll()}else currentId=projects[0].id}
function renderProjects(){let list=projects.filter(p=>filter==='all'||p.type===filter);$('projects').innerHTML=list.map(p=>`<div class="project ${p.id===currentId?'active':''}" data-id="${p.id}">${icon(p.type)} ${esc(p.title||'Untitled')}</div>`).join('');document.querySelectorAll('.project').forEach(x=>x.onclick=()=>{currentId=x.dataset.id;load();renderProjects()})}
function icon(t){return {movie:'🎬',anime:'📺',book:'📚',summary:'📝',free:'✍️'}[t]||'📄'}function esc(s){return s.replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
function load(){let p=current();if(!p)return;$('projectTitle').value=p.title;$('editor').value=p.text;$('pageHeading').textContent=p.heading||defaultHeading(p.type);$('styleSelect').value=p.style||'book';applyStyle();stats();$('typeStat').textContent=label(p.type);$('saveStatus').textContent='Saved locally'}
function label(t){return {movie:'Movie Script',anime:'Anime Script',book:'Book / Novel',summary:'Summary',free:'Free Writing'}[t]}function defaultHeading(t){return t==='summary'?'Summary':t==='movie'||t==='anime'?'SCENE 1':'Chapter 1'}
function sync(){let p=current();if(!p)return;p.title=$('projectTitle').value;p.text=$('editor').value;p.style=$('styleSelect').value;p.updated=Date.now();saveAll();stats();$('saveStatus').textContent='Saved just now'}
function stats(){let t=$('editor').value.trim();let w=t?t.split(/\s+/).length:0,c=$('editor').value.length,m=Math.max(0,Math.ceil(w/200));$('words').textContent=w+' words';$('chars').textContent=c+' characters';$('readtime').textContent=m+' min read';$('words2').textContent=w;$('chars2').textContent=c;$('time2').textContent=m+' min'}
function applyStyle(){let s=$('styleSelect').value;$('paper').className='paper '+s}
function toast(t){$('toast').textContent=t;$('toast').classList.add('show');setTimeout(()=>$('toast').classList.remove('show'),1800)}
$('editor').addEventListener('input',sync);$('projectTitle').addEventListener('input',sync);$('styleSelect').addEventListener('change',()=>{sync();applyStyle()});$('saveBtn').onclick=()=>{sync();toast('Saved locally')};
$('newBtn').onclick=()=>{$('modal').classList.add('show');$('newTitle').focus()};$('cancel').onclick=()=>$('modal').classList.remove('show');$('create').onclick=()=>{let title=$('newTitle').value.trim()||'Untitled Project',type=$('newType').value;let p={id:uid(),title,type,style:type==='movie'||type==='anime'?'script':'book',heading:defaultHeading(type),text:'',updated:Date.now()};projects.unshift(p);currentId=p.id;saveAll();$('modal').classList.remove('show');$('newTitle').value='';load();renderProjects();toast('Project created')};
document.querySelectorAll('[data-filter]').forEach(b=>b.onclick=()=>{filter=b.dataset.filter;renderProjects()});$('formatBtn').onclick=()=>{let t=$('editor').value.replace(/[ \t]+\n/g,'\n').replace(/\n{3,}/g,'\n\n');$('editor').value=t;sync();toast('Text formatted')};
$('chapterBtn').onclick=()=>{let n=Number((current().heading||'Chapter 1').match(/\d+/)?.[0]||1)+1;current().heading='Chapter '+n;current().text+='\n\n';load();sync();toast('New chapter')};$('sceneBtn').onclick=()=>{let p=current();p.text+='\n\nSCENE '+(p.text.match(/SCENE \d+/g)?.length+1||1)+'\n\n';sync();$('editor').focus()};$('clearBtn').onclick=()=>{if(confirm('Clear this project text?')){$('editor').value='';sync()}};
$('checkBtn').onclick=()=>{let t=$('editor').value,s=[];if(/\bi\b/.test(t))s.push('Consider capitalizing “I”.');if(/\s+[,.!?]/.test(t))s.push('Remove spaces before punctuation.');if(/\b(very very|really really)\b/i.test(t))s.push('Consider replacing repeated intensifiers with a stronger word.');if(/ {2,}/.test(t))s.push('There are multiple spaces.');if(!s.length)s.push('No obvious basic issues found. Browser spellcheck is also active while you type.');$('suggestions').innerHTML=s.map(x=>`<div class="suggestion">${esc(x)}</div>`).join('')};
function download(name,data,type){let a=document.createElement('a');a.href=URL.createObjectURL(new Blob([data],{type}));a.download=name;a.click();URL.revokeObjectURL(a.href)}$('exportTxt').onclick=()=>{let p=current();download((p.title||'story')+'.txt',p.text,'text/plain;charset=utf-8');toast('TXT exported')};$('exportPdf').onclick=()=>{let p=current();let old=document.title;document.title=p.title||'StoryForge';window.print();document.title=old};
window.addEventListener('beforeprint',()=>{$('editor').style.minHeight='auto'});window.addEventListener('afterprint',()=>{$('editor').style.minHeight='650px'});if('serviceWorker' in navigator) navigator.serviceWorker.register('./sw.js').catch(()=>{});seed();load();renderProjects();
</script></body></html>
