.cv2.img>*{display:none}.cv2.pgv{background:#fffcf4;color:#27221c}.pgv i,.pgv em{display:none}.pgv b{flex:none;justify-content:center;text-align:center;font-size:13px;letter-spacing:.14em;text-transform:uppercase;text-shadow:none}

.mb input#rn{width:100%}

.cv2{background:linear-gradient(140deg,#323238,#0b0b0e 70%);color:#f1e7d0}

<script>
(()=>{
const $=s=>document.querySelector(s),KEY='storyforge.projects.v2',DK='storyforge.draft.v1',uid=()=>Date.now().toString(36)+Math.random().toString(36).slice(2,7);
const esc=s=>String(s??'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const T={book:['📚','Books','Chapter','Book'],movie:['🎬','Movies','Scene','Movie'],anime:['📺','Anime','Episode','Anime'],summary:['📝','Summaries','Part','Summary'],free:['✍️','Writing','Note','Free write']};
const SUM=['Topic','Key points','Short summary','Long summary'],PG={pocket:[408,640],trade:[528,816],a5:[560,794],letter:[816,1056]};

const words=t=>t.trim()?t.trim().split(/\s+/).length:0,pw=p=>p.chapters.reduce((a,c)=>a+words(c.content),0);

let P,C,st=[0],cur=0,PC={},H=[],F=[],last='',flt='all',lpg=0,sv=1,sn,sp,R=[];

function norm(p){const s=isS(p);p.page=PG[p.page]?p.page:s?'letter':'trade';p.size=p.size||(s?16:17);p.lh=p.lh||1.55;p.align=p.align||'left';p.font=p.font||'';p.author=p.author||'';p.style=p.style||(s?'script':'book');
 if(!p.chapters||!p.chapters.length)p.chapters=[{id:uid(),title:T[p.type][2]+' 1',content:''}];p.chapters.forEach(c=>{c.content=c.content||'';c.id=c.id||uid()});return p}
D.forEach(norm);

/* ---------- library ---------- */
const CL={book:'#d9953f',movie:'#d4577a',anime:'#5b8def',summary:'#47b39a',free:'#9b78e0'},DS={book:'Chapters & pages',movie:'Scenes & dialogue',anime:'Episodes & narration',summary:'Key points & recap',free:'Anything, your way'};

 $('#tiles').innerHTML=Object.entries(T).map(([k,v])=>`<button class="tl" style="--c:${CL[k]}" data-n="${k}"><b>${v[0]}</b><span>${v[3]}<small>${DS[k]}</small></span></button>`).join('');
 $('#chips').innerHTML=[['all','All']].concat(Object.entries(T).map(([k,v])=>[k,v[1]])).map(([k,n])=>`<button class="${flt===k?'on':''}" data-f="${k}">${n} ${k==='all'?D.length:D.filter(p=>p.type===k).length}</button>`).join('');

 if(s==='x')return $('#as').classList.remove('on');
 snap();if(s==='fmt')setC(C.content.replace(/[ \t]+$/gm,'').replace(/[ \t]{2,}/g,' ').replace(/\n{3,}/g,'\n\n').trim()+'\n');else setC(R[+s].f(C.content))};
$('#as').onchange=e=>{if(e.target.id==='spc')ta.spellcheck=e.target.checked};
/* export */
const safe=s=>(s||'StoryForge').replace(/[\\/:*?"<>|]/g,'_').trim()||'StoryForge';
const full=()=>`${P.title}\n${P.author?'by '+P.author+'\n':''}\n`+P.chapters.map((c,i)=>`${hdr(c,i).replace(/<small>/,' — ').replace(/<[^>]+>/g,'').replace(/&amp;/g,'&')}\n\n${c.content}`).join('\n\n\n');
function dl(data,name,type){const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([data],{type}));a.download=name;document.body.appendChild(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(a.href),2000)}
$('#ex').onclick=()=>{snap();persist();modal(`<h3>Export “${esc(P.title)}”</h3><div class="m">My Writing/${T[P.type][1]}/${esc(safe(P.title))}</div><div class="bt"><button data-a="txt">Text (.txt)</button><button data-a="pdf">PDF / Print</button><button data-a="cp">Copy text</button><button data-a="sh">Share</button>${P.chapters.length>1?'<button data-a="chs" style="grid-column:1/-1">Each section as .txt</button>':''}</div><button data-x>Close</button>`)};
function sheets(){const g=geo(P),s=isS(P);let n=0,o='';
 if(P.type==='book')o+=`<section class="sh cv s-${P.style}" style="width:${g.w}px;height:${g.h}px;padding:${g.mt}px ${g.mx}px;font-family:${FONTS.Georgia}"><h1>${esc(P.title)}</h1>${P.author?`<div style="font-size:18px;font-style:italic">by ${esc(P.author)}</div>`:''}</section>`;
 P.chapters.forEach((c,ci)=>{const pg=pag(c.content,P);pg.forEach((a,i)=>{n++;const t=c.content.slice(a,pg[i+1]??c.content.length);
  o+=`<section class="sh s-${P.style}" style="width:${g.w}px;min-height:${g.h}px;padding:${g.mt}px ${g.mx}px ${g.mb}px;--lh:${g.lh}px;--mx:${g.mx}px">${i===0&&g.hd?`<div class="hd" style="height:${g.hd}px">${hdr(c,ci)}</div>`:''}<div class="tx" style="font:${P.size}px/${g.lh}px ${ff(P)};text-align:${P.align}">${s?fs(t):esc(t)}</div><div class="pn" style="bottom:20px;right:${g.mx}px">${String(n).padStart(2,'0')}</div></section>`})});return o}
function fs(t){let pv='';return t.split('\n').map(l=>{const s=l.trim();let c='ac';if(!s){pv='';return'<div><br></div>'}
 if(/^(INT|EXT|EST|I\/E|SCENE)[.\s]/i.test(s))c='sc';else if(/^(NARRATION|NARRATOR|N)\s*:/i.test(s))c='nr';else if(s===s.toUpperCase()&&/(TO|IN|OUT)[:.]$/.test(s))c='tr';
 else if(/^\(.*\)$/.test(s)&&(pv==='ch'||pv==='dl'||pv==='pa'))c='pa';else if(s===s.toUpperCase()&&/[A-Z]/.test(s)&&s.length<38&&!pv)c='ch';else if(pv==='ch'||pv==='pa'||pv==='dl')c='dl';
 pv=c;return`<div class="${c}">${esc(l)}</div>`}).join('')}
$('#mb').onclick=async e=>{const b=e.target.closest('button');if(!b||!b.dataset.a)return;const a=b.dataset.a;
 if(a==='txt'){dl(full(),safe(P.title)+'.txt','text/plain;charset=utf-8');closeM()}
 else if(a==='pdf'){closeM();const g=geo(P);let s=document.getElementById('pgcss');if(!s){s=document.createElement('style');s.id='pgcss';document.head.appendChild(s)}
  s.textContent=`@page{size:${g.w}px ${g.h}px;margin:0}`;$('#prn').innerHTML=sheets();setTimeout(()=>{window.print()},200)}
 else if(a==='cp'){try{await navigator.clipboard.writeText(full());toast('Copied to clipboard')}catch{toast('Copy not available here')}closeM()}
 else if(a==='sh'){closeM();if(navigator.share)try{await navigator.share({title:P.title,text:full()})}catch{}else{try{await navigator.clipboard.writeText(full());toast('Sharing unavailable — copied instead')}catch{}}}
 else if(a==='chs'){closeM();P.chapters.forEach((c,i)=>setTimeout(()=>dl(`${c.title}\n\n${c.content}`,`${String(i+1).padStart(2,'0')} ${safe(c.title)}.txt`,'text/plain;charset=utf-8'),i*350))}
 else if(a==='ok'){const v=$('#rn').value.trim();if(v){closeM();askFn&&askFn(v)}}else if(a==='cv'){$('#f_cv').click()}else if(a==='cx'){delete P.cover;P.updated=Date.now();persist();closeM();toast('Cover removed')}else if(a==='sl'){save();closeM();goLib()}else if(a==='dc'){closeM();P=null;localStorage.removeItem(DK);goLib()}else if(a==='bk'){dl(JSON.stringify({version:3,exported:new Date().toISOString(),projects:D},null,1),'StoryForge-backup.json','application/json');closeM()}
 else if(a==='rs'){const f=$('#rf');f.onchange=()=>{const r=new FileReader();r.onload=()=>{try{const x=JSON.parse(r.result);if(!Array.isArray(x.projects))throw 0;x.projects.forEach(p=>{norm(p);const i=D.findIndex(q=>q.id===p.id);if(i<0)D.push(p);else D[i]=p});persist();closeM();lib();toast('Backup restored')}catch{toast('That file is not a StoryForge backup')}};r.readAsText(f.files[0])};f.click()}};
window.addEventListener('afterprint',()=>{$('#prn').innerHTML=''});
window.addEventListener('pagehide',()=>{if(P)persist()});document.addEventListener('visibilitychange',()=>{if(document.hidden&&P)persist()});
let rz;window.addEventListener('resize',()=>{clearTimeout(rz);rz=setTimeout(()=>{if($('#ed').classList.contains('on')){render(ta.selectionStart);fit()}else lib()},80)});
if('serviceWorker' in navigator&&/^https?:/.test(location.protocol))navigator.serviceWorker.register('sw.js').catch(()=>{});
lib();try{const d=JSON.parse(localStorage.getItem(DK)||'null');if(d&&d.chapters)open(null,norm(d))}catch{}
})();
</script></body></html>
